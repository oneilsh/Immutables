url: https://oneilsh.github.io/immutables

template:
  bootstrap: 5

home:
  title: Immutables
  description: Monoid-annotated 2-3 finger trees for R

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    intro:
      text: "Getting Started"
      href: articles/index.html
    reference:
      text: "Reference API"
      href: reference/index.html
    articles:
      text: "Articles"
      menu:
        - text: "Data structures"
        - text: "Sequences, Stacks, and Queues"
          href: articles/flexseq.html
        - text: "Priority Queues"
          href: articles/priority-queues.html
        - text: "Ordered Sequences"
          href: articles/ordered-sequences.html
        - text: "Interval Indices"
          href: articles/interval-indices.html
        - text: "---------"
        - text: "Examples"
        - text: "Benchmarks"
          href: articles/benchmarks.html
        - text: "Gallery"
          href: articles/gallery.html
        - text: "---------"
        - text: "Internals"
        - text: "Developer API"
          href: articles/developer-api.html

articles:
  - title: "Getting started"
    desc: "Package overview and entrypoint."
    contents:
      - index
  - title: "Data structures"
    desc: "Per-structure guides to API, semantics, and usage patterns."
    contents:
      - flexseq
      - priority-queues
      - ordered-sequences
      - interval-indices
  - title: "Examples"
    desc: "Applied use cases and performance comparisons."
    contents:
      - benchmarks
      - articles/gallery
  - title: "Internals"
    desc: "Monoid/predicate internals and validation utilities."
    contents:
      - developer-api

reference:
  - title: "Flexible Sequence (flexseq)"
    desc: |
      General-purpose persistent sequence with O(1) amortized push/pop at
      both ends, O(log n) indexing and replacement, and efficient split/concat.
    contents:
      - flexseq
      - as_flexseq
      - push_front
      - push_back
      - pop_front
      - pop_back
      - peek_front
      - peek_back
      - insert_at
      - peek_at
      - pop_at
      - split_at
      - fapply
      - loop
      - "as_iterator.flexseq"
      - "c.flexseq"
      - "merge.flexseq"
      - "[.flexseq"
      - "print.flexseq"
      - "length.flexseq"
      - "as.list.flexseq"
      - "unlist.flexseq"

  - title: "Priority Queue"
    desc: |
      Persistent priority queue with O(log n) insert and min/max peek/pop.
      Name-based read indexing only; cast with `as_flexseq()` for full
      sequence operations.
    contents:
      - priority_queue
      - as_priority_queue
      - insert
      - peek_min
      - peek_max
      - peek_all_min
      - peek_all_max
      - pop_min
      - pop_max
      - pop_all_min
      - pop_all_max
      - min_priority
      - max_priority
      - fapply
      - "as_iterator.priority_queue"
      - "merge.priority_queue"
      - "[.priority_queue"
      - "[[.priority_queue"
      - "as.list.priority_queue"
      - "unlist.flexseq"
      - "print.priority_queue"
      - "length.priority_queue"

  - title: "Ordered Sequence"
    desc: |
      Persistent key-ordered sequence with O(log n) insert, key lookup,
      and range queries. Read indexing preserves key order; replacement
      indexing is not supported.
    contents:
      - ordered_sequence
      - as_ordered_sequence
      - insert
      - peek_key
      - peek_all_key
      - pop_key
      - pop_all_key
      - lower_bound
      - upper_bound
      - elements_between
      - count_key
      - count_between
      - min_key
      - max_key
      - fapply
      - "merge.ordered_sequence"
      - "[.ordered_sequence"
      - "print.ordered_sequence"
      - "length.ordered_sequence"
      - "as.list.ordered_sequence"
      - "unlist.flexseq"

  - title: "Interval Index"
    desc: |
      Persistent interval index with O(log n) insertion and immutable
      interval query/pop helpers over ordered interval endpoints.
    contents:
      - interval_index
      - as_interval_index
      - insert
      - peek_point
      - peek_all_point
      - pop_point
      - pop_all_point
      - peek_overlaps
      - peek_all_overlaps
      - peek_containing
      - peek_all_containing
      - peek_within
      - peek_all_within
      - pop_overlaps
      - pop_all_overlaps
      - pop_containing
      - pop_all_containing
      - pop_within
      - pop_all_within
      - min_endpoint
      - max_endpoint
      - fapply
      - "merge.interval_index"
      - "[.interval_index"
      - "print.interval_index"
      - "length.interval_index"
      - "as.list.interval_index"
      - "unlist.flexseq"

  - title: "Developer Tools"
    desc: "Lower-level primitives for custom monoids, predicate queries, validation, and structure visualization."
    contents:
      - add_monoids
      - get_measure
      - get_measures
      - locate_by_predicate
      - split_around_by_predicate
      - split_by_predicate
      - measure_monoid
      - validate_tree
      - validate_name_state
      - plot_structure
